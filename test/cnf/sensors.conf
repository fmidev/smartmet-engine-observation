// A minimal configuration for opening the test cache in SensorsTest

quiet = true;
serializedStationsFile = "/usr/share/smartmet/test/data/sqlite/stations.txt";
dbRegistryFolderPath = "../../cnf/db_registry";

stationtypes = ["mast"];

stationtypelist:
{
	mast:
	{
		stationtype = "mast";
		databaseTableName = "observation_data";
		useCommonQueryMethod = true;
		producerIds = [46];
	};
};

parameters = ["ta", "ws"];

ta:
{
	mast = "1";
};

ws:
{
	mast = "41";
};

database_driver_info:
(
	{
		name = "spatialite_test_fmi_observations";
		tables = ["observation_data"];
		caches = [];
		active = true;
	}
);
